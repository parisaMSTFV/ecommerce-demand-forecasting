name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python -m pytest
      - name: Sensitive-content check
        run: python scripts/check_sensitive.py
      - name: Pipeline smoke test
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          python -m ecommerce_forecasting.cli smoke
          python -m ecommerce_forecasting.cli smoke-supplied
